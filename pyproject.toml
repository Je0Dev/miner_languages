[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "miner-v2"
version = "2.0.0"
description = "Game Sentence Miner v2 - Language learning sentence mining toolkit"
requires-python = ">=3.10"
dependencies = [
    "pillow",
    "numpy",
    "scipy",
    "pytesseract",
    "deep-translator",
    "flask",
    "websockets",
    "rapidfuzz",
    "regex",
    "jieba",
    "pypinyin",
    "romkan",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
miner = "miner.main:main"
